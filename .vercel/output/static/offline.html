<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — FundedWealth</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background: linear-gradient(135deg, #0a0018 0%, #1a0a2e 100%);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      
      .container {
        max-width: 500px;
        width: 100%;
      }
      
      .card {
        padding: 40px 32px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      
      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        border: 1px solid rgba(168, 85, 247, 0.3);
      }
      
      h1 {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .subtitle {
        color: #cbd5e1;
        font-size: 16px;
        margin-bottom: 8px;
        line-height: 1.6;
      }
      
      .message {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 32px;
        line-height: 1.6;
      }
      
      .button-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      
      button {
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      
      .btn-retry {
        background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
        color: #fff;
        flex: 1;
        min-width: 140px;
        justify-content: center;
      }
      
      .btn-retry:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3);
      }
      
      .btn-retry:active {
        transform: translateY(0);
      }
      
      .status {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 13px;
        color: #64748b;
      }
      
      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      .btn-retry.loading .spinner {
        display: block;
      }
      
      .btn-retry.loading {
        opacity: 0.8;
        pointer-events: none;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @media (max-width: 480px) {
        .card {
          padding: 32px 24px;
        }
        
        h1 {
          font-size: 24px;
        }
        
        .button-group {
          flex-direction: column;
        }
        
        .btn-retry {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="icon">📡</div>
        <h1>You're offline</h1>
        <p class="subtitle">FundedWealth is not connected to the internet</p>
        <p class="message">Please check your network connection and try again. Your progress is safe.</p>
        
        <div class="button-group">
          <button class="btn-retry" onclick="retryConnection()">
            <span class="spinner"></span>
            <span class="btn-text">Retry</span>
          </button>
        </div>
        
        <div class="status">
          <p id="status-text">Waiting for network connection...</p>
        </div>
      </div>
    </div>
    
    <script>
      let isChecking = false;
      
      // If the browser believes it is online, reload to restore the app.
      if (navigator.onLine) {
        window.location.href = '/';
      }
      
      function retryConnection() {
        if (isChecking) return;
        
        const btn = document.querySelector('.btn-retry');
        const btnText = btn.querySelector('.btn-text');
        const statusText = document.getElementById('status-text');
        
        btn.classList.add('loading');
        btnText.textContent = 'Checking...';
        statusText.textContent = 'Checking connection...';

        if (navigator.onLine) {
          statusText.textContent = 'Connection detected! Reloading...';
          setTimeout(() => window.location.reload(), 500);
          return;
        }

        isChecking = false;
        btn.classList.remove('loading');
        btnText.textContent = 'Retry';
        statusText.textContent = 'Still offline. Please check your connection.';
      }
      
      window.addEventListener('online', () => {
        const statusText = document.getElementById('status-text');
        statusText.textContent = 'Connection restored! Reloading...';
        setTimeout(() => window.location.reload(), 500);
      });

      window.addEventListener('offline', () => {
        const statusText = document.getElementById('status-text');
        statusText.textContent = 'You are offline. Check your network and try again.';
      });
      
      window.addEventListener('load', () => {
        const statusText = document.getElementById('status-text');
        if (navigator.onLine) {
          statusText.textContent = 'Connection detected. Reloading...';
          setTimeout(() => window.location.reload(), 500);
        }
      });
    </script>
  </body>
</html>
