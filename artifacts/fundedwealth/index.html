    <!-- SEO-only static H1: visually hidden but always present in the DOM for
         crawlers and screen readers. Placed outside the loader so it is never
         removed when the loading screen is torn down after React mounts. -->
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;" aria-hidden="true">
      Get Funded to Trade Indian Markets — FundedWealth Simulated Prop Trading Evaluations in India
    </h1>
    <div id="fw-init-loader">
      <div class="fw-spinner"></div>
    </div>
    <div id="root"></div>

    <script>
      // Hide loader once React has rendered
      var _fwObs = new MutationObserver(function () {
        var root = document.getElementById("root");
        if (root && root.firstChild) {
          var loader = document.getElementById("fw-init-loader");
          if (loader) {
            loader.classList.add("hide");
            setTimeout(function () {
              loader.remove();
            }, 350);
          }
          _fwObs.disconnect();
        }
      });
      _fwObs.observe(document.getElementById("root"), { childList: true });
    </script>
