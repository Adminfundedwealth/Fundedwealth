version: 1.0
runtime: nodejs18

build:
  commands:
    pre-build:
      - corepack enable
      - corepack prepare pnpm@11.1.1 --activate
      - pnpm install --no-frozen-lockfile
    build:
      - pnpm --filter @workspace/db run push 2>/dev/null || true
      - pnpm --filter @workspace/api-server run build
  env:
    - name: NODE_ENV
      value: production

run:
  command: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
  network:
    port: 9000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "9000"
