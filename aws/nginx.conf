# Nginx configuration for FundedWealth API Server
# Place at: /etc/nginx/sites-available/fundedwealth-api

upstream fundedwealth_api {
    server 127.0.0.1:8080;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name api.fundedwealth.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name api.fundedwealth.com;

    # SSL (certbot will manage these)
    ssl_certificate /etc/letsencrypt/live/api.fundedwealth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fundedwealth.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Body size limit (for file uploads)
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # API proxy
    location / {
        proxy_pass http://fundedwealth_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://fundedwealth_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Health check (no auth required)
    location /api/health {
        proxy_pass http://fundedwealth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
