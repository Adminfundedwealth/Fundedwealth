name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (high + critical)
        run: pnpm audit --audit-level=high

      - name: Check for known vulnerable patterns
        run: |
          echo "Checking for hardcoded secrets..."
          ! grep -rn "sk_live_\|rzp_live_\|sk_test_" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=.git src/ artifacts/ lib/ 2>/dev/null || true
          
          echo "Checking for eval() usage..."
          ! grep -rn "\beval(" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=.git artifacts/ lib/ 2>/dev/null || true
          
          echo "Checking for dangerouslySetInnerHTML without DOMPurify..."
          FILES=$(grep -rln "dangerouslySetInnerHTML" --include="*.tsx" --exclude-dir=node_modules artifacts/ 2>/dev/null || true)
          for f in $FILES; do
            if ! grep -q "DOMPurify" "$f"; then
              echo "WARNING: $f uses dangerouslySetInnerHTML without DOMPurify"
              exit 1
            fi
          done
          
          echo "All security checks passed."
