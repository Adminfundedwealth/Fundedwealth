apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server-{{color}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
      color: "{{color}}"
  template:
    metadata:
      labels:
        app: api-server
        color: "{{color}}"
    spec:
      containers:
        - name: api-server
          image: {{image}}
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-server
spec:
  selector:
    app: api-server
    color: blue
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
