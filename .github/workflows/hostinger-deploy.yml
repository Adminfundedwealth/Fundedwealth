name: Deploy Frontend to Hostinger (DISABLED)

# Disabled — frontend now deploys via Vercel automatically
on:
  workflow_dispatch: # manual trigger only, won't run on push

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter @workspace/fundedwealth build

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la artifacts/fundedwealth/dist/
          ls -la artifacts/fundedwealth/dist/assets/ | head -5

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: artifacts/fundedwealth/dist/
          server-dir: /public_html/
          dangerous-clean-slate: true
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
